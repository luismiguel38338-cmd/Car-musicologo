name: Compilar Web & Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-web-and-pwa:
    name: Compilar Aplicación Web y PWA
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Dependencias
        run: npm install --no-audit --no-fund

      - name: Verificar Tipos TypeScript
        run: npm run lint

      - name: Compilar Distribución de Producción
        run: npm run build

      - name: Subir Artefactos de la App Web
        uses: actions/upload-artifact@v4
        with:
          name: radio-musicologos-web-build
          path: dist/
          retention-days: 14

  build-android-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    needs: build-web-and-pwa
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Instalar Dependencias
        run: npm install --no-audit --no-fund

      - name: Compilar Web e inicializar Capacitor Android
        run: npm run build:apk

      - name: Compilar APK con Gradle
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Subir Archivo APK Compilado
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: radio-musicologos-android-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            dist/
          retention-days: 30
